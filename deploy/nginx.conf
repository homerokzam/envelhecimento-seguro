server {
    listen 80 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5090;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome: nunca mudam, então cache longo. Se não existir (chunk de um deploy
    # anterior), responde 404 de verdade em vez de devolver o index.html como se fosse JavaScript.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html referencia os arquivos com hash do deploy atual: sempre revalidar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
